# Catalog texts shown at GET /api/v1/rules, in the UI («Нарушения и источники») and in README (scripts/catalog.py).
# The rule list itself comes from app/rules.yaml at runtime; this file holds what is not per rule.
# sources: code = letter used in docs/normative_research.md; short = name used in the README table; the rules that
# cite each act are added from rules.yaml by app.api.load_catalog.
checked: "17.10.2026"   # texts compared with adilet.zan.kz
principle:
  - "Каждое правило каталога строится по цепочке «сигнал → факт → правило → пункт норматива → кадры-доказательства»."
  - "Часть сигналов дают локальные модели без VLM: детектор и трекер людей (S2) отмечают уход и возвращение кассира, вход и выход посетителей и их число, а пиксельный анализ показывает состояние двери и яркость кадра. VLM задаём только узкие вопросы да/нет о видимом факте по кропу зоны (стол, сейф, дверь, ноутбук или весь кадр): лежат ли банкноты, открыт ли сейф, торчит ли ключ, показывают ли экран посетителю. Ряды P(да) сглаживаются и превращаются в интервалы состояний."
  - "Нарушение — это событие вместе с состоянием в этот момент (кассир ушёл, а наличные на столе; вошёл посетитель, а деньги прошлой операции не убраны), а не само действие: уходы, входы и открытый при клиенте сейф есть и на чистых видео."
  - "Правило привязывается к пункту акта, только если пункт прямо описывает видимое или его назначение однозначно с ним связано. Цитата берётся дословно из docs/normative_research.md, сверенного с adilet.zan.kz."
  - "Кандидата перепроверяет VLM (S7): 2–4 формулировки вопроса по клипу из 6–8 кадров, решение большинством голосов; вопрос о контексте, на котором держится правило (открытая дверца сейфа у R22), обязателен и отклоняет кандидата при любом большинстве. Без подтверждения остаётся только кандидат, у которого факт уверенно держится несколько секунд подряд; для правил с неоднозначными сигналами подтверждение обязательно. Правила по пиксельным сигналам (дверь, яркость кадра) идут без S7."
  - "В отчёт попадают тип, таймкод события, 1–3 кадра (момент события, пик уверенности, кадр через 3 с), описание по шаблону, пункт акта и ссылка на adilet."
  - "Сила связи: В — пункт прямо требует или запрещает то, что видно на кадре; С — пункт прямой, но для вывода нужен контекст (кто человек, какая операция); Н — связь выведена из назначения нормы. Для Н описание начинается с «Возможное несоответствие: »: это подсказка администратору, который проверяет каждый результат, а не юридический вывод."
  - "Типы, которые по видео без звука и без распознавания лиц не отличить от нормы, и типы, которые исследование прямо велит не флагать, вынесены в список непроверяемых с указанием причины."

strengths:
  "В": {label: "прямое требование", text: "пункт прямо требует или запрещает то, что видно на кадре"}
  "С": {label: "следует из нормы", text: "пункт прямой, но для вывода нужен контекст (кто человек, какая операция)"}
  "Н": {label: "из назначения нормы", text: "связь выведена из назначения нормы; описание начинается с «Возможное несоответствие: »"}

sources:
  - code: A
    short: "Правила № 231"
    act: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в БВУ… (пост. Правления НБРК от 29.11.2019 № 231, ред. на 12.07.2026)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    used_for: "Основной источник: приём, выдача и пересчёт при клиенте, уход с рабочего места, хранение наличных, ключей и печатей, личные вещи и телефоны, двойной контроль, сумки инкассации. Исключения, которые защищают от ложных срабатываний: п. 32, 35, 49–50, 99."
  - code: B
    short: "Правила № 14"
    act: "Правила организации охраны и устройства помещений БВУ… (пост. Правления НБРК от 24.02.2020 № 14)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"
    used_for: "Требования к устройству кассы: изоляция кассового узла, отдельный вход с дверью на замке, видеокамеры. Применяются по назначению нормы, поэтому сила связи Н."
  - code: C
    short: "Пост. № 88"
    act: "О внесении изменений в постановление № 14 (пост. Правления НБРК от 24.12.2024 № 88)"
    url: "https://adilet.zan.kz/rus/docs/V2400035552"
    used_for: "Подтверждает, что п. 16 пп. 1) и 6) Правил № 14, на которые ссылаются R08 и R18, одинаковы во временной и постоянной редакциях."
  - code: D
    short: "Правила № 49"
    act: "Правила осуществления обменных операций с наличной иностранной валютой в РК (пост. Правления НБРК от 04.04.2019 № 49)"
    url: "https://adilet.zan.kz/rus/docs/V1900018545"
    used_for: "Только аналогия: п. 41 (запрет посторонних в операционной кассе обменного пункта) объясняет силу Н у R09; п. 11 пп. 2) поясняет, почему «работа вне поля зрения камеры» не проверяется как отдельный тип."
  - code: E
    short: "Правила № 230"
    act: "Правила определения платежности банкнот и монет национальной валюты РК (пост. Правления НБРК от 29.11.2017 № 230)"
    url: "https://adilet.zan.kz/rus/docs/V1700016120"
    used_for: "Обоснование, почему требование о пересчёте на оборудовании с проверкой машиночитаемых признаков (к A п. 41) по видео не проверяется."
  - code: F
    short: "АРРФР № 86"
    act: "Правила формирования системы управления рисками и внутреннего контроля для банков… (пост. Правления АРРФР от 28.04.2026 № 86)"
    url: "https://adilet.zan.kz/rus/docs/V2600038586"
    used_for: "Вспомогательная ссылка: принцип «четырёх глаз» и «совместного доступа» (п. 117) к R16 и R22, контроль доступа к ценностям (п. 117 пп. 3)) к R01 и R02."
  - code: G
    short: "АРРФР № 53"
    act: "Требования к обеспечению информационной безопасности банков… (пост. Правления АРРФР от 03.04.2026 № 53)"
    url: "https://adilet.zan.kz/rus/docs/V2600038336"
    used_for: "Меры защиты рабочих станций и ноутбуков определяет банк (п. 53); это и дополнительная опора R21. П. 71 пп. 9) (автоблокировка через 30 минут) объясняет, почему у R04 и R21 сила Н."
  - code: H
    short: "Закон о банках"
    act: "Закон РК «О банках и банковской деятельности в Республике Казахстан» от 16.01.2026 № 258-VIII (закон 1995 г. № 2444 утратил силу и не цитируется)"
    url: "https://adilet.zan.kz/rus/docs/Z2600000258"
    used_for: "Оговорка к R21: ст. 69 допускает раскрытие банковской тайны самому клиенту банка, а чьи сведения на экране, по видео не установить, поэтому у R21 сила Н. Текст ст. 69 сверен 17.10.2026; цитата R21 взята из акта A."

not_checkable:
  - item: "Приём наличных без предъявления документа, удостоверяющего личность (правило R14 отключено)"
    why: "A п. 19 пп. 1) допускает идентификацию и через сервис цифровых документов, а удостоверение на кадре 464×848 модель не отличает от квитанции или карточки: на чистых Х-3 и Х-39 правило срабатывало ложно, а на размеченном Х-2 вопрос «есть ли удостоверение» отвечал «да». Правило сохранено в коде и включается флагом, но в отчёт не выводится."
  - item: "Выдача наличных без пересчёта при клиенте"
    why: "A п. 32 разрешает выдавать целые пачки и корешки в неповреждённой упаковке без полистного пересчёта, а целостность упаковки при 464×848 не видна. Зонд пересчёта не видит ручной пересчёт (Х-14, 50–110 с: P ≈ 0), а зонд передачи денег путает её направление. Правило давало бы в основном ложные срабатывания; размеченного примера нет."
  - item: "Смешение номиналов в одной пачке"
    why: "Проверено двумя формулировками по кропу стола: на размеченном Х-44 P ≤ 0,22, а на чистых видео при ручном пересчёте разноцветных купюр — до 0,56 (Х-45, Х-14). Нарушение от нормы не отличить. Кроме того, сборные пачки разрешены (A п. 49–50)."
  - item: "Вскрытие повреждённой сумки без инкассатора"
    why: "A п. 25 касается только повреждённой сумки, а повреждение и пломбу при 464×848 не видно. Целую сумку кассир вскрывает один — это норма (Х-14)."
  - item: "Инкассатор без бронежилета или каски"
    why: "A п. 103 и п. 109-6 обязывают оснастить бригаду и запрещают выезд без экипировки, но не требуют носить её каждую секунду. На чистом Х-16 у инкассатора нет видимой защиты: правило сработало бы на чистом видео."
  - item: "Инкассатор один, без сопровождения"
    why: "A п. 99 допускает бригаду из двух человек (инкассатор-сборщик и водитель), и водитель остаётся снаружи. Исследование прямо велит не флагать."
  - item: "Клиент ушёл, не пересчитав деньги"
    why: "A п. 35 — условие для претензий клиента, а не обязанность кассира. Исследование прямо велит не флагать."
  - item: "Работа вне поля зрения камеры как отдельный тип"
    why: "Перекрытую или тёмную камеру ловит R18, наличные, оставленные при уходе, — R01. Вынос наличных из кадра в хранилище — штатная операция, и куда их несут, по видео не видно. D п. 11 пп. 2) (зона кассира и клиента в кадре) действует только для обменных пунктов."
  - item: "Кассир кладёт деньги в карман или личную сумку"
    why: "Проверено на тестовом ролике с таким сценарием: четыре формулировки по кадрам с шагом 0,25 с и две по клипам S7 дают P ≤ 0,1, потому что руки ниже стола не видны. Без подтверждения VLM косвенный признак («деньги исчезли со стола») превращается в шум. Сумку на столе ловит R10."
  - item: "Передача наличных третьему лицу, а не клиенту"
    why: "Без распознавания лиц (FAQ, № 29) роли посетителей не различить: S2 знает только их число. Зонд передачи денег путает её направление, размеченных примеров нет. Второго человека во время обслуживания отмечает R09."
  - item: "Посторонний на стороне кассира или у открытого сейфа"
    why: "S2 не даёт положения и роли посетителей. Вопрос VLM «второй человек, кроме кассира, на стороне кассира или у сейфа» неразборчив: 0,6 и на самой кассирше у сейфа, и на клиентах, ни разу не выше 0,7. Частично покрыто правилами R02 (открытый сейф без присмотра), R06 (вход при наличных на столе), R09 (второй посетитель) и R05 (клиент остался один)."
  - item: "Фотосъёмка наличных или документов на телефон как отдельный тип"
    why: "Зонд по кадру видит съёмку на тестовом ролике (0,9), но так же отвечает на чистом Х-5 (кассир рассматривает удостоверение, клиент держит телефон: 0,88) и при пересчёте (0,7–0,8). Подтверждение клипом S7 не срабатывает (0,38). Покрыто правилом R11, которое ссылается на тот же A п. 12 ч. 2 о средствах с фото- и видеофиксацией."
  - item: "Иное подозрительное действие"
    why: "Отдельного правила нет: канал S8 описывает клипы вокруг событий S2 и сопоставляет описание с каждым правилом каталога. Совпадение всегда относится к существующему правилу и проходит S7, поэтому ссылка на норму не выдумывается. Правила, которые S7 по клипу подтвердить не может (дверь и яркость кадра без вопросов S7, R16 «без пересчёта», R22 «сейф открыт с начала пересчёта»), S8 не предлагает."
  - item: "Пересчёт наличных без контролирующего работника при закрытом сейфе"
    why: "A п. 42 требует присутствия контролирующего работника при пересчёте вне операций с клиентом, но на чистом Х-21 кассир так же одна пересчитывает наличные, взятые из сейфа, закрыв его перед этим, и это размечено как норма; вскрытие и пересчёт целой сумки в одиночку тоже норма (Х-14). Есть ли контролирующий работник за кадром, по видео не установить. Поэтому одиночный пересчёт отмечается только вместе с открытым сейфом без присмотра (R22), а уборка в сейф — только без пересчёта (R16)."
  - item: "Пересчёт на оборудовании с проверкой защитных признаков, сверка сумм, подписи и штампы на документах"
    why: "A п. 9, 41, E п. 36–37, A п. 19 пп. 4)–5), п. 56: модель счётной машинки, её функции и текст документов при 464×848 без звука не различимы."
