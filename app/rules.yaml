# family: how the rule is triggered (see app/pipeline/rules.py FAMILIES)
# strength: В — clause directly describes what is seen; С — needs context; Н — indirect, phrase as "возможное несоответствие"
# verify: questions for S7; window = seconds relative to the candidate time; expect = yes|no; zone defaults to the fact's zone
#         required: true = veto (the candidate is rejected when this question disagrees, whatever the majority)
#         options: [A, B, ...] = multiple choice (one-token answers), expect = the option that confirms the rule
#         scale: upscale factor for this question's crops (a few banknotes on the desk crop vanish in a 6-frame clip)
# params.offset_s: shift of the reported timecode (S7 windows and evidence frames keep the candidate time)
# params.s8: false = the S8 channel never proposes the rule (its context cannot be confirmed on one clip)
- id: R01
  type: "Наличные или ценности оставлены без присмотра"
  summary: "Кассир покинул рабочее место, а на столе вне запирающегося хранилища остаются наличные или инкассаторская сумка, в том числе положенные на стол уже в его отсутствие."
  signals: "S2 фиксирует уход кассира (cashier_left), и в этот момент зонды по кропу стола видят банкноты (F_cash_desk) или инкассаторскую сумку (F_bag_desk). Второе семейство ловит те же предметы, если они появились на столе после ухода (≥ 3 с, ≥ 2 с в конце короткого ролика), кассир так и не вернулся, а в помещении в это время был посетитель (положить предмет на стол пустой комнаты некому: без посетителя это шум зонда на пустом столе после штатного ухода)."
  family: [on_cashier_left, appeared_while_away]
  facts: [F_cash_desk, F_bag_desk]
  params: {tol: 1.5, strong_k: 3, min_s: 3.0, end_min_s: 2.0, offset_s: -1.0}
  strength: "В"
  norm: {act: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в БВУ… (пост. Правления НБРК от 29.11.2019 № 231)", point: "п. 20 ч. 2", url: "https://adilet.zan.kz/rus/docs/V1900019680",
         quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах … закрывающихся на ключ"}
  template: "В {t} с на столе без присмотра кассира остаются наличные или инкассаторская сумка (кадр {te} с). Наличные должны храниться в запирающемся устройстве на рабочем месте."
  verify:
    - {q: "Are banknotes or a cash bag lying on the desk?", window: [0, 5], scale: 2}
    - {q: "Is money left on the table surface?", window: [0, 5], scale: 2}
    - {q: "Is the cashier's chair empty while money remains on the desk?", window: [1, 6], zone: full, required: true}
