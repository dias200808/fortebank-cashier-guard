- id: R11
  type: "Мобильный телефон в кассовом помещении"
  summary: "Кассир пользуется смартфоном в кассовом помещении, хотя допускаются только средства связи без фото- и видеофиксации. Съёмка наличных или документов на телефон — частный случай этого правила."
  signals: "Зонд F_phone по рамке кассира (трекер + выбор кассира; телефон клиента через стол в кадр не попадает) держится ≥ 2 с; S7 всегда: клип той же рамки, вопрос с вариантами «телефон / деньги / карта или документ / другое / ничего» — вето, если не «телефон»."
  family: presence
  facts: [F_phone]
  params: {min_s: 2.0, strong_k: 99, bridge_s: 0.5}
  strength: "С"
  norm: {act: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в БВУ… (пост. Правления НБРК от 29.11.2019 № 231)", point: "п. 12 ч. 2", url: "https://adilet.zan.kz/rus/docs/V1900019680",
         quote: "Допускается внос … средств связи, не имеющих функции фото и видео фиксации"}
  template: "С {t} с кассир пользуется мобильным телефоном (кадр {te} с); допускаются только средства связи без функции фото- и видеофиксации."
  # always through S7 (strong_k 99): one frame of a small cashier crop cannot tell a phone from banknotes held the same
  # way (X-8, X-13, X-14 count notes: F_phone 0.9-1.0 for 2-4 s); the clip with the option list can: P(A) 0.00-0.08
  # on those candidates, 0.96-1.00 on the AI phone clips. bridge_s: one dropped frame must not split a phone episode
  verify:
    - {q: "Is the cashier holding a mobile phone?", window: [0, 4], zone: cashier}
    - {q: "Is the cashier looking at a smartphone?", window: [0, 4], zone: cashier}
    - {q: "Is there a phone in the cashier's hand?", window: [0, 4], zone: cashier}
    - {q: "What does the cashier hold in her hands in these frames? A: a mobile phone; B: banknotes or money; C: a card, passport or document; D: a bag or something else; E: nothing. Answer with the letter only.", window: [0, 4], zone: cashier, options: [A, B, C, D, E], expect: A, required: true}
